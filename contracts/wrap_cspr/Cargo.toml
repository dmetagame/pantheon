[package]
name = "wrap_cspr"
version = "0.1.0"
edition = "2021"
authors = ["Pantheon"]

[[bin]]
name = "wrap_cspr"
path = "src/main.rs"
test = false
doctest = false
bench = false
doc = false

[dependencies]
# NOTE: do NOT enable `no-std-helpers` — its panic / alloc-error handlers
# carry redundant `#[no_mangle]` attributes that recent Rust nightlies
# reject (see contracts/wrap_cspr/src/handlers.rs for the local copy).
casper-contract = { version = "5.0.1", default-features = false }
casper-types = { version = "6.1.0", default-features = false }


[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
